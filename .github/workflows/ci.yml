name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,pdf,vector]'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: ci-only-postgres-password
        run: |
          psql -h localhost -U postgres -d rag -v ON_ERROR_STOP=1 -f migrations/001_pgvector.sql
          psql -h localhost -U postgres -d rag -v ON_ERROR_STOP=1 -f migrations/002_local_role.sql
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: PostgreSQL integration tests
        env:
          RAG_TEST_DATABASE_URL: postgresql+psycopg://rag_runtime:local-rag-development-only@localhost:5432/rag
        run: |
          test -n "$RAG_TEST_DATABASE_URL"
          python -m pytest -q -m integration -rs --junitxml=integration-results.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("integration-results.xml").getroot(); s=[r] if r.tag=="testsuite" else list(r.iter("testsuite")); t=sum(int(x.get("tests",0)) for x in s); k=sum(int(x.get("skipped",0)) for x in s); print("integration:",t,"skipped:",k); assert t>0 and k==0'
